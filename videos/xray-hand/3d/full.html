 const c=crackUV(),cp=fb.uv(c).add(fb.g.position).add(V3(0,0,0));
 return {update(u,d,t){drawXray(fb.T,{crack:k_(u,1.6,.8)});const kr=k_(u,2.6,.6);rg.position.copy(cp).add(V3(0,0,.08));rg.scale.setScalar(pop(kr)*(1+.06*Math.sin(t*5)));rg.visible=kr>0},

 const md=new THREE.Group();md.position.set(0,3.1,0);A.add(md);mesh(new THREE.CylinderGeometry(.75,.75,.14,48),M('#d9b24a',{metalness:.9,roughness:.25}),[0,0,0],md).rotation.x=Math.PI/2;
 mesh(new THREE.CylinderGeometry(.58,.58,.16,48),M('#e8c77a',{metalness:.8,roughness:.3}),[0,0,0],md).rotation.x=Math.PI/2;[-1,1].forEach(s=>{const rb=mesh(RB(.28,1.1,.04,.02),M(s<0?'#46698a':'#c4532c'),[s*.2,.85,-.05],md);rb.rotation.z=s*.25});
 const sh=new THREE.PointLight('#fff0c0',3,5);sh.position.set(1,3.6,1.5);A.add(sh);
 const pt=new THREE.Group();pt.position.set(1.4,1.4,.8);A.add(pt);mesh(RB(.9,1.15,.03,.01),M('#f4efe0'),[0,0,0],pt);const px=new THREE.Group();pt.add(px);[1,-1].forEach(s=>{const b=mesh(RB(1.2,.12,.08,.04),M('#c4532c'),[0,0,.06],px);b.rotation.z=s*.78});
 const r=makeChar(RONT);r.g.position.set(-1.3,0,.5);r.g.rotation.y=.5;A.add(r.g);
 const gt=canvasTex(512,256);gt.x.fillStyle='#5fa8d8';gt.x.fillRect(0,0,512,256);gt.x.fillStyle='#7fae5a';for(let i=0;i<14;i++){gt.x.beginPath();gt.x.ellipse(rnd(i)*512,40+rnd(i+3)*176,30+rnd(i+6)*50,20+rnd(i+9)*30,rnd(i)*3,0,6.3);gt.x.fill()}gt.t.needsUpdate=true;

 return {update(u,d,t){S.background.set('#d9c6a0');const a=u<2.4;A.visible=a;B.visible=!a;
  if(a){md.scale.setScalar(pop(k_(u,.1,.5)));md.rotation.y=Math.sin(t*1.5)*.6;r.g.visible=false;ovH+=sketchChar(person(92,620,.5,t,{g:'m',beard:true,hairCol:'#6b625a',top:'#3e3a36',bottom:'#2b2b2b',seed:.2,mood:'happy',arms:[[-84,-170],[130,-250]]}));const kp=k_(u,1.3,.4);px.scale.setScalar(pop(kp));pt.rotation.z=.15+.1*kp;

// ── الرسم عند الثانية t ────────────────────────────────
function chunks(n){const k=Math.ceil(n/6),sz=Math.ceil(n/k),o=[];for(let a=0;a<n;a+=sz)o.push([a,Math.min(n,a+sz)]);return o}
window.renderAt=t=>{let i=0;while(i<LN.length-1&&L(i+1)<=t)i++;const sc=SCN[i],u=t-L(i),d=Math.max(.5,L(i+1)-L(i));
 SCN.forEach((s,j)=>s.g.visible=j===i);ovH='';S.background.copy(BG);hemi.intensity=.9;key.intensity=1.6;
 const c=sc.cam(u,d,t);const sw=Math.sin(t*.9)*.04;camAt([c[0][0]+sw,c[0][1]+Math.cos(t*1.1)*.03,c[0][2]],c[1]);
 sc.update(u,d,t);R.render(S,cam);OV.innerHTML=ovH;
 // الترجمة: كلمة بكلمة، 6 كلمات بالكتير في المرة
 const l=LN[i],w=l.text.split(' '),K=KEYS[i]||{},tot=w.join('').length;let acc=0,now=-1;for(let j=0;j<w.length;j++){if(t>=l.start+(l.end-l.start)*(acc/tot)-.05)now=j;acc+=w[j].length}if(t>l.end+.15)now=w.length;
 const ch=chunks(w.length);let ci=0;ch.forEach((q,j)=>{if(Math.max(now,0)>=q[0])ci=j});
 CAP.innerHTML=w.slice(ch[ci][0],ch[ci][1]).map((x,j)=>{j+=ch[ci][0];return '<span class="'+(K[x]||'')+(j===now?' now':j>now?' fut':'')+'">'+x+'</span>'}).join(' ');
 CAP.style.opacity=(.4+.6*Math.min(1,Math.max(0,(t-l.start+.1)/.2))).toFixed(2);};
