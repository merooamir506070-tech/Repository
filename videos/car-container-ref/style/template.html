<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>video</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  /* ستايل المرجع: رسم مالي الشاشة العمودية كلها، وكلمة واحدة كبيرة في النص (الكلمة اللي بتتقال دلوقتي) */
  html, body { margin: 0; background: #000; }
  .canvas { position: relative; width: 360px; height: 640px; background: #cfc3a8; overflow: hidden; }
  .panel { position: absolute; inset: 0; overflow: hidden; }
  .panel svg { display: block; width: 100%; height: 100%; }
  .cap { position: absolute; left: 0; right: 0; top: 44px; text-align: center; }
  .pill { display: inline-block; max-width: 300px; background: #23262b; color: #fff; border: 1.5px solid #e9e9e6; border-radius: 16px; padding: 3px 14px 5px; font: 800 16px/1.5 "Noto Sans Arabic", sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .pill span { opacity: .55; } .pill span.on { opacity: 1; } .pill span.cur { color: #f7c948; opacity: 1; }
  .kw { display: inline-block; margin-top: 6px; background: #d9362b; color: #fff; border: 2px solid #23262b; border-radius: 12px; padding: 0 14px 3px; font: 900 22px/1.45 "Noto Sans Arabic", sans-serif; transform-origin: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .tag { font-family: "Noto Sans Arabic", sans-serif; font-weight: 800; fill: #2b2016; }
</style></head>
<body>
<div class="canvas">
  <div class="panel"><svg id="panel" viewBox="0 0 360 640"></svg></div>
  <div class="cap"><div class="pill" id="cap"></div><br><div class="kw" id="kw" style="display:none"></div></div>
  <div aria-hidden="true" style="position:absolute;left:-999px;opacity:0;font:900 20px 'Noto Sans Arabic'">إزاي العربية الكونتينر 0123</div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .08 0"/></filter>
  <linearGradient id="sky-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb7e0"/><stop offset=".55" stop-color="#b9d8ec"/><stop offset="1" stop-color="#f3dfc2"/></linearGradient>
  <linearGradient id="sky-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a06e"/><stop offset=".5" stop-color="#f7d0a0"/><stop offset="1" stop-color="#fbe9cc"/></linearGradient>
  <linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset=".6" stop-color="#1e3458"/><stop offset="1" stop-color="#2f4a72"/></linearGradient>
  <linearGradient id="sky-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a7a"/><stop offset=".55" stop-color="#c98aa0"/><stop offset="1" stop-color="#f6c99a"/></linearGradient>
  <linearGradient id="grass-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9dbb6e"/><stop offset="1" stop-color="#6f9548"/></linearGradient>
  <linearGradient id="grass-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3a66a"/><stop offset="1" stop-color="#857a44"/></linearGradient>
  <linearGradient id="grass-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4a35"/><stop offset="1" stop-color="#16281c"/></linearGradient>
  <linearGradient id="grass-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9a5a"/><stop offset="1" stop-color="#5a6a3a"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d6a66"/><stop offset="1" stop-color="#3f3d3a"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb3d9"/><stop offset=".5" stop-color="#2b86b5"/><stop offset="1" stop-color="#123f66"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a3a"/><stop offset="1" stop-color="#06141e"/></linearGradient>
  <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8f96"/><stop offset="1" stop-color="#4b5056"/></linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9eef7"/><stop offset=".6" stop-color="#8fc2da"/><stop offset="1" stop-color="#5d93ad"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dc9e"/><stop offset=".5" stop-color="#c9a04e"/><stop offset="1" stop-color="#7a5a24"/></linearGradient>
  <clipPath id="win"><rect x="430" y="40" width="150" height="110" rx="6"/></clipPath>
  <path id="swash" d="M6 14 C40 4 120 2 196 8 C214 10 222 20 214 30 C206 44 140 46 70 44 C30 44 4 40 2 30 C0 24 2 18 6 14 Z"/>
  <!--DEFS-->
</defs></svg>
<script src="timing.js"></script>
<script>/*DATA*/</script>
<script src="scenes.js"></script>
<script>
  (function () {
    var LN = TIMING.lines, cap = document.getElementById("cap"), kw = document.getElementById("kw"), panel = document.getElementById("panel"), curKey = "";
    window.VIDEO_END = TIMING.duration;
    function chunks(w) { var out = [], cur = []; for (var k = 0; k < w.length; k++) { cur.push(k); if (cur.length >= 4 || /[،,.؟?!]$/.test(w[k])) { out.push(cur); cur = []; } } if (cur.length) out.push(cur); return out; }
    window.renderAt = function (t) {
      window.__panel(panel, t);
      var i = 0; while (i < LN.length - 1 && LN[i + 1].start - 0.05 <= t) i++;
      var c = CAPS[i], l = LN[i], cw = -1, wAt = 0, tot = c.w.join("").length, acc = 0;
      for (var k = 0; k < c.w.length; k++) { var at = l.start + (l.end - l.start) * (acc / tot) - 0.05; if (t >= at) { cw = k; wAt = at; } acc += c.w[k].length; }
      if (cw < 0) cw = 0;
      var ch = chunks(c.w), ci = 0; for (var j = 0; j < ch.length; j++) if (ch[j].indexOf(cw) >= 0) ci = j;
      var speaking = t <= l.end + 0.15, key = i + ":" + ci + ":" + cw + ":" + speaking;
      if (key !== curKey) {
        cap.innerHTML = ch[ci].map(function (k) { return '<span class="' + (k < cw ? "on" : k === cw && speaking ? "cur" : k === cw ? "on" : "") + '">' + c.w[k] + '</span>'; }).join(" ");
        var kwi = -1; for (var m = 0; m <= cw; m++) if (c.k[m]) kwi = m;
        if (kwi >= 0) { kw.style.display = "inline-block"; kw.textContent = c.w[kwi].replace(/[،,.؟?!:]+$/, ""); } else kw.style.display = "none";
        curKey = key;
      }
      var kk = 0; for (var m = 0; m <= cw; m++) if (c.k[m]) kk = m;
      var acc2 = 0; for (var m = 0; m < kk; m++) acc2 += c.w[m].length;
      var kAt = l.start + (l.end - l.start) * (acc2 / tot), p = Math.min(1, Math.max(0, (t - kAt) / 0.25));
      kw.style.transform = "scale(" + (p < 0.6 ? 0.6 + p : 1.2 - (p - 0.6) * 0.5).toFixed(3) + ") rotate(-3deg)";
    };
    var q = location.hash.match(/t=([\d.]+)/); renderAt(q ? +q[1] : 0.5);
  })();
</script>
</body></html>
